<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="リソース管理ツール - 開発テーマごとの人員配置を可視化">
    <title>リソース管理ツール</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/gantt.css">
    <link rel="stylesheet" href="/css/member-view.css">
</head>

<body>
    <!-- Main App -->
    <div id="app-screen" class="screen">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="10" fill="url(#logo-grad2)" />
                        <path d="M12 14h16v3H12zm0 5h12v3H12zm0 5h8v3H12z" fill="white" opacity="0.9" />
                        <defs>
                            <linearGradient id="logo-grad2" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#6366f1" />
                                <stop offset="1" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="sidebar-title">Resource Mgr</span>
            </div>
            <ul class="nav-list">
                <li><a href="#" class="nav-item active" data-view="gantt">
                        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M3 4h14v2H3zm0 5h10v2H3zm0 5h6v2H3z" />
                        </svg>
                        <span>テーマ ガント</span>
                    </a></li>
                <li><a href="#" class="nav-item" data-view="member-load">
                        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 0114 0H3z" />
                        </svg>
                        <span>メンバー負荷</span>
                    </a></li>
                <li><a href="#" class="nav-item" data-view="themes">
                        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M4 3h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2zm0 2v10h12V5H4z" />
                        </svg>
                        <span>テーマ管理</span>
                    </a></li>
                <li><a href="#" class="nav-item" data-view="members">
                        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M9 6a3 3 0 11-6 0 3 3 0 016 0zm8 0a3 3 0 11-6 0 3 3 0 016 0zm-4.07 11c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
                        </svg>
                        <span>メンバー管理</span>
                    </a></li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">A</div>
                    <span id="user-name">admin</span>
                </div>
                <button id="logout-btn" class="btn btn-ghost btn-sm" title="ログアウト">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h4a1 1 0 100-2H4V5h3a1 1 0 100-2H3zm11.293 3.293a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L15.586 11H8a1 1 0 110-2h7.586l-1.293-1.293a1 1 0 010-1.414z" />
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Main content -->
        <main id="main-content">
            <!-- Gantt View -->
            <div id="view-gantt" class="view active">
                <div class="view-header">
                    <h2>テーマ視点 ガントチャート</h2>
                    <div class="view-controls">
                        <div class="scale-switcher" id="scale-switcher">
                            <button class="scale-btn active" data-scale="1">1M</button>
                            <button class="scale-btn" data-scale="3">3M</button>
                            <button class="scale-btn" data-scale="6">6M</button>
                            <button class="scale-btn" data-scale="12">1Y</button>
                        </div>
                        <div class="toggle-nav">
                            <button id="gantt-expand-all" class="btn btn-ghost btn-sm" title="全展開">全展開</button>
                            <button id="gantt-collapse-all" class="btn btn-ghost btn-sm" title="全たたみ">全たたみ</button>
                            <button id="gantt-export-csv" class="btn btn-ghost btn-sm" title="CSVエクスポート">CSV出力</button>
                        </div>
                        <div class="month-nav">
                            <button id="gantt-prev" class="btn btn-icon" title="前へ">◀</button>
                            <button id="gantt-today" class="btn btn-ghost btn-sm">今月</button>
                            <button id="gantt-next" class="btn btn-icon" title="次へ">▶</button>
                        </div>
                    </div>
                </div>
                <div class="gantt-container" id="gantt-container">
                    <table class="gantt-table" id="gantt-table">
                        <thead id="gantt-thead"></thead>
                        <tbody id="gantt-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Member Load View -->
            <div id="view-member-load" class="view" hidden>
                <div class="view-header">
                    <h2>メンバー負荷表</h2>
                    <div class="view-controls">
                        <div class="scale-switcher" id="member-scale-switcher">
                            <button class="scale-btn active" data-scale="1">1M</button>
                            <button class="scale-btn" data-scale="3">3M</button>
                            <button class="scale-btn" data-scale="6">6M</button>
                            <button class="scale-btn" data-scale="12">1Y</button>
                        </div>
                        <div class="month-nav">
                            <button id="member-prev" class="btn btn-icon" title="前へ">◀</button>
                            <button id="member-today" class="btn btn-ghost btn-sm">今月</button>
                            <button id="member-next" class="btn btn-icon" title="次へ">▶</button>
                        </div>
                    </div>
                </div>
                <div class="member-load-container" id="member-load-container">
                    <table class="member-load-table" id="member-load-table">
                        <thead id="member-load-thead"></thead>
                        <tbody id="member-load-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Theme Management -->
            <div id="view-themes" class="view" hidden>
                <div class="view-header">
                    <h2>テーマ管理</h2>
                    <button id="add-theme-btn" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" />
                        </svg>
                        テーマ追加
                    </button>
                </div>
                <div class="card-list" id="theme-list"></div>
            </div>

            <!-- Member Management -->
            <div id="view-members" class="view" hidden>
                <div class="view-header">
                    <h2>メンバー管理</h2>
                    <button id="add-member-btn" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" />
                        </svg>
                        メンバー追加
                    </button>
                </div>
                <div class="card-list" id="member-list"></div>
            </div>
        </main>
    </div>

    <!-- Modal overlay -->
    <div id="modal-overlay" class="modal-overlay" hidden>
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip" hidden></div>

    <!-- Cell editor popover -->
    <div id="cell-editor" class="cell-editor" hidden>
        <input type="number" id="cell-editor-input" min="0" max="100" step="1">
        <span class="cell-editor-unit">%</span>
        <div class="cell-editor-actions">
            <button id="cell-editor-save" class="btn btn-primary btn-sm">OK</button>
            <button id="cell-editor-clear" class="btn btn-danger btn-sm">クリア</button>
            <button id="cell-editor-cancel" class="btn btn-ghost btn-sm">✕</button>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>

</html>
